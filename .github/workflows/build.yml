name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-VST3
          - os: macos-latest
            name: macOS-VST3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release --target MidiStackLens_VST3 --parallel 4

      - name: Build and run tests
        run: |
          cmake --build build --config Release --target chord_test analysis_test recording_test
          ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MidiStackLens-${{ matrix.name }}
          path: build/MidiStackLens_artefacts/Release/VST3/

  # タグ(v0.3.1 など)を打つと、Windows / Mac の zip を「Releases」に載せる(ログイン不要でダウンロードできる)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip
        run: |
          cd artifacts
          for d in MidiStackLens-*; do (cd "$d" && zip -r -q "../MIDI-Stack-Lens-${GITHUB_REF_NAME}-${d#MidiStackLens-}.zip" .); done
          ls -la *.zip

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "MIDI Stack Lens $GITHUB_REF_NAME" \
            --notes "ダウンロード: 下の「Assets」から、お使いのOSの zip を選んでください(Windows は Windows-VST3、Mac は macOS-VST3)。入れ方は README の「ダウンロードして使う」を見てください。"

  # 画面の確認用: Linux で Standalone をビルドし、デモ表示のスクリーンショットを残す
  preview:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            xvfb imagemagick fonts-noto-cjk ffmpeg

      - name: Build standalone
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DMSL_BUILD_EXPORT_DEMO=ON
          cmake --build build --config Release --target MidiStackLens_Standalone MslExportDemo MslProcessorRecTest --parallel 4

      - name: Recording and video export check
        run: |
          xvfb-run -a build/MslProcessorRecTest_artefacts/Release/MslProcessorRecTest
          xvfb-run -a build/MslExportDemo_artefacts/Release/MslExportDemo demo-portrait.mp4 portrait 30
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames -of default=nw=1 demo-portrait.mp4

      - name: Screenshot
        run: |
          APP="build/MidiStackLens_artefacts/Release/Standalone/MIDI Stack Lens"
          for theme in light dark; do
            xvfb-run -a -s "-screen 0 1280x900x24" bash -c "MSL_DEMO=1 MSL_DEMO_THEME=$theme \"$APP\" & sleep 9; import -window root preview-$theme.png; kill %1 || true"
          done

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: MidiStackLens-preview
          path: preview-*.png
